<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,sans-serif" font-size="13">
<rect width="900" height="470" fill="#f6f5f2"/>
<!-- Project details dialog -->
<rect x="20" y="20" width="420" height="430" rx="10" fill="#fff" stroke="#ccc"/>
<text x="40" y="56" font-size="20" font-family="Georgia,serif">Project details</text>
<text x="40" y="88" font-weight="600" font-size="11">Project name</text><rect x="40" y="96" width="380" height="30" rx="6" fill="none" stroke="#bbb"/><text x="50" y="116">SKD Workbench</text>
<text x="40" y="146" font-weight="600" font-size="11">Local folder</text><rect x="40" y="154" width="380" height="30" rx="6" fill="none" stroke="#bbb"/><text x="50" y="174">/Users/…/skd-workbench</text>
<text x="40" y="214" font-size="11" fill="#777">… Git connection (unchanged) …</text>
<line x1="40" y1="236" x2="420" y2="236" stroke="#ddd"/>
<text x="40" y="262" font-weight="600">Remove project</text>
<text x="40" y="282" font-size="11" fill="#555">Hides it from Workbench. Files, Git and history stay; restore it from System.</text>
<rect x="40" y="294" width="130" height="30" rx="6" fill="#fff" stroke="#a43b29"/><text x="55" y="314" fill="#a43b29">Remove project…</text>
<line x1="40" y1="344" x2="420" y2="344" stroke="#ddd"/>
<rect x="220" y="400" width="80" height="30" rx="6" fill="#fff" stroke="#bbb"/><text x="238" y="420">Cancel</text>
<rect x="310" y="400" width="110" height="30" rx="6" fill="#c9582f"/><text x="325" y="420" fill="#fff">Save project</text>
<!-- Confirm dialog -->
<rect x="470" y="20" width="410" height="230" rx="10" fill="#fff" stroke="#ccc"/>
<text x="490" y="56" font-size="18" font-family="Georgia,serif">Remove SKD Workbench?</text>
<text x="490" y="84" font-size="12">It leaves the sidebar, Home and the orchestrator’s projects.</text>
<text x="490" y="104" font-size="12">The folder, Git data, workflows, runs and conversation stay.</text>
<text x="490" y="124" font-size="12">Restore it any time from System › Removed projects.</text>
<text x="490" y="152" font-size="11" fill="#a43b29">Blocked while a run or agent session is active (names it).</text>
<rect x="650" y="200" width="80" height="30" rx="6" fill="#fff" stroke="#bbb"/><text x="668" y="220">Cancel</text>
<rect x="740" y="200" width="120" height="30" rx="6" fill="#a43b29"/><text x="752" y="220" fill="#fff">Remove project</text>
<!-- System list -->
<rect x="470" y="270" width="410" height="180" rx="10" fill="#fff" stroke="#ccc"/>
<text x="490" y="302" font-size="16" font-family="Georgia,serif">Removed projects</text>
<line x1="490" y1="316" x2="860" y2="316" stroke="#ddd"/>
<text x="490" y="342" font-weight="600">SKD Workbench</text><text x="490" y="360" font-size="11" fill="#777">/Users/…/skd-workbench · removed Sep 23</text>
<rect x="780" y="330" width="80" height="28" rx="6" fill="#fff" stroke="#bbb"/><text x="797" y="349">Restore</text>
<line x1="490" y1="376" x2="860" y2="376" stroke="#eee"/>
<text x="490" y="404" font-size="11" fill="#777">Empty state: “No removed projects.”</text>
</svg>
